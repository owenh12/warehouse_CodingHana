[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsidiv"
version = "0.1.0"
description = "RSI 강세 다이버전스 전략: 백테스트 → 파라미터 검증 → 모의투자 → 실거래"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
data = ["ccxt>=4.3", "exchange_calendars>=4.5"]
viz = ["matplotlib>=3.8"]
optimize = ["optuna>=3.6"]
live = ["APScheduler>=3.10,<4", "websockets>=12"]
dev = ["pytest>=8", "TA-Lib>=0.6", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML", "types-requests"]
all = ["rsidiv[data,viz,optimize,live,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # 한글 주석·문자열의 전각 기호 허용, 줄 길이는 포매터에 맡김

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "talib"]
ignore_missing_imports = true
