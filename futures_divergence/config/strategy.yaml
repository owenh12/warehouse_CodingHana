# RSI 강세·약세 다이버전스 (각 타임프레임 독립 판정)
#
# 강세(Long):  t1(피벗 저점) → p2(피벗 고점) → t3(이탈 확정 봉)
#   p2  = t1 이후 확정된 피벗 고점 중 최고가. [t1, t3−1] 구간 최고 High 여야 함
#   t3  = p2 이후 Close(t3) < min(Low[p2 .. t3−1]) 인 봉 (봉 마감 시 판정, t3 마감 = 신호 확정)
#   조건 Close(t3) < Low(t1),  RSI(t1) < oversold,  RSI(t3) > oversold
# 약세(Short): p1(피벗 고점) → t2(피벗 저점) → p3(이탈 확정 봉), 강세와 대칭
#   조건 Close(p3) > High(p1), RSI(p1) > overbought, RSI(p3) < overbought
# 상세 규칙과 판정 순서: docs/DESIGN.md §4

rsi:
  period: 14
  source: close
  method: wilder                # RMA. 첫 평균 = 첫 period 개 변화량의 단순평균 (TradingView ta.rsi 와 같음)

atr:
  period: 14
  method: wilder

pivot:                          # t1·p2(강세), p1·t2(약세)에만 적용. t3·p3 는 이탈 확정 방식
  left: 1                       # L
  right: 1                      # R = 피벗 확정 지연 봉 수
  tie_rule: first               # first: 왼쪽은 엄격, 오른쪽은 같음 허용 → 동일값이 이어지면 첫 봉만 피벗 (사용자 결정, 2단계 후)
                                # strict: 좌우 모든 봉보다 엄격히 낮아야(높아야) 피벗 → 동일값이 이웃에 있으면 피벗 아님

bullish:
  enabled: true
  oversold: 30.0                # RSI(t1) < 30 이고 RSI(t3) > 30

bearish:
  enabled: true
  overbought: 70.0              # RSI(p1) > 70 이고 RSI(p3) < 70

structure:
  anchor_candidates: all        # t1(p1) 후보를 모두 독립 추적 (사용자 결정)
  same_bar_signals: one_latest_anchor   # 한 봉에서 여러 구조가 동시에 성립하면 신호 1건, 가장 최근 t1(p1)을 기록
  discard_on_anchor_break: true # t1~p2 사이에 Low(t1) 보다 낮은 저가가 나오면 구조 폐기 (약세: p1~t2 사이 High(p1) 보다 높은 고가)
                                # 3단계 후 사용자 결정. p2 봉 자신의 저가도 포함
  gap_bars:                     # t1~t3 (p1~p3) 간격, 신호 타임프레임 봉 수
    max_enabled: true
    max: 60
    min_enabled: false
    min: 3

exit:
  evaluation_timeframe: 15m     # 손절·익절·시간 청산 도달 판정 봉 (사용자 결정: 판정만 15분봉)
  stop:
    atr_mult: 2.5               # Long: Low(t3) − ATR×2.5, Short: High(p3) + ATR×2.5. ATR 은 신호 TF 의 t3(p3) 값
    order_type: stop_market
  take_profit:
    mode: r_multiple            # structure: High(p2)/Low(t2) | r_multiple: 손절폭 × r | trailing: ATR 트레일링
    r_multiple: 2.0
    trailing_atr_mult: 2.5      # trailing: 진입 후 최고가(숏은 최저가) ∓ ATR(신호 TF, t3) × mult. 15분봉 마감마다 갱신
  time_exit:
    enabled: true
    bars: 60                    # 신호 타임프레임 봉 60개 (1d 신호 = 60일, 15m 신호 = 15시간). 사용자 결정

positioning:
  opposite_signal: ignore       # ignore: 보유 중 반대 신호 무시 | switch: 청산 후 반대 진입
  priority: [timeframe_desc, rank_asc]   # 동시 신호: 상위 타임프레임 > 거래량 순위 상위
