# 백테스트 엔진 (이벤트 기반 자체 구현)
fill:
  entry: next_open              # 신호 봉 마감 후 다음 봉 시가 (15분 실행 봉 시가와 같은 시각)
  same_bar_stop_and_target: stop_first   # 같은 실행 봉에서 둘 다 닿으면 손절 우선 (보수적)
  intrabar_precision: false     # true: 1분봉으로 봉 내부 순서를 판정 (정밀 모드)
  gap_through_stop: fill_at_open
  limit_fill_rule: touch        # touch | through (1틱 이상 넘어서야 체결)
  delisting: close_at_last_trade  # 거래 중단·상장폐지 시 마지막 체결가로 청산 기록

instruments:                    # 과거 거래 규칙 (이 환경에서 exchangeInfo 를 받을 수 없어 대체)
  qty_step: kline_volume_decimals  # 아카이브 kline 거래량 문자열의 소수 자릿수 = 수량 단위 (BTC 0.001, DOGE 1 …)
  min_notional: 5.0             # USDT, 거래소 기본 최소 주문 명목가
  min_notional_overrides: {BTCUSDT: 100.0, ETHUSDT: 20.0}   # 가정: 대형 코인 예외값

risk_rules_variants: [with_live_rules, without_live_rules]

benchmark:
  symbol: BTCUSDT               # BTC Buy & Hold: 시작 시점 BTCUSDT 무기한 1배 롱, 펀딩비·진입 수수료 반영

metrics:
  risk_free_rate: 0.0
  return_frequency: daily       # 샤프·소르티노 = 일별(KST) 수익률, 연 365일

outputs:
  trades_csv: true
  signals_csv: true             # 진입 여부와 무관한 전체 신호 (스킵 사유 포함)
  equity_csv: true
  charts: [equity, drawdown, signal_samples]
  signal_sample_count: 30
