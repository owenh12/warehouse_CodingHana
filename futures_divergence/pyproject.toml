[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perpdiv"
version = "0.1.0"
description = "바이낸스 USDⓈ-M 거래량 상위 10개 코인 RSI 강세·약세 다이버전스: 백테스트 → 검증 → 모의투자 → 실거래"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
data = ["ccxt>=4.3"]
viz = ["matplotlib>=3.8"]
optimize = ["optuna>=3.6"]
live = ["APScheduler>=3.10,<4"]
dev = ["pytest>=8", "TA-Lib>=0.6", "pandas_ta_classic>=0.8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs",
       "types-PyYAML", "types-requests"]
all = ["perpdiv[data,viz,optimize,live,dev]"]

[project.scripts]
perpdiv = "perpdiv.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "talib", "pandas_ta_classic", "pandas_ta_classic.*"]
ignore_missing_imports = true
